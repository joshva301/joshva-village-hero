function swordHit(){if(attackCooldown>0)return;attackCooldown=.42;attackAnim=.32;let hit=false;const forward=new THREE.Vector3(Math.sin(hero.rotation.y),0,Math.cos(hero.rotation.y));for(const e of enemies){if(!e.visible)continue;const delta=new THREE.Vector3(e.position.x-hero.position.x,0,e.position.z-hero.position.z);const d=delta.length();if(d<=2.15&&d>0&&forward.dot(delta.normalize())>.35){e.userData.hp--;hit=true;if(e.userData.hp<=0){e.visible=false;defeated++;hud.dataset.notice='Enemy defeated!';}else hud.dataset.notice='Sword hit!';break;}}if(!hit)hud.dataset.notice='Miss! Aim toward enemy';}
function attack(){if(health<=0||defeated>=3||attackCooldown>0)return;attackAnim=.28;if(weapon==='sword'){swordHit();return;}attackCooldown=.32;const dir=new THREE.Vector3(Math.sin(hero.rotation.y),0,Math.cos(hero.rotation.y));const arrow=new THREE.Mesh(new THREE.SphereGeometry(.09,8,8),new THREE.MeshBasicMaterial({color:0xffe9a6}));arrow.position.copy(hero.position);arrow.position.y=1.25;scene.add(arrow);projectiles.push({mesh:arrow,dir,speed:18,life:1.8});hud.dataset.notice='Arrow shot!';}
const attackBtn=document.getElementById('attack');let attackHold=null;function stopAttackHold(){if(attackHold!==null){clearInterval(attackHold);attackHold=null}}attackBtn.addEventListener('pointerdown',e=>{e.preventDefault();attackBtn.setPointerCapture(e.pointerId);attack();stopAttackHold();attackHold=setInterval(attack,420)});attackBtn.addEventListener('pointerup',stopAttackHold);attackBtn.addEventListener('pointercancel',stopAttackHold);attackBtn.addEventListener('lostpointercapture',stopAttackHold);attackBtn.addEventListener('click',e=>{e.preventDefault();});window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();attack()}if(e.key==='1'&&weapon!=='sword')selectWeapon();if(e.key==='2'&&weapon!=='bow')selectWeapon()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const joy=document.getElementById('joystick'),stick=document.getElementById('stick');function setJoy(e){const r=joy.getBoundingClientRect();let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;let d=Math.hypot(x,y),max=38;if(d>max){x=x/d*max;y=y/d*max}joyX=x/max;joyY=y/max;stick.style.left=35+x+'px';stick.style.top=35+y+'px'}joy.addEventListener('pointerdown',e=>{joyActive=true;joy.setPointerCapture(e.pointerId);setJoy(e)});joy.addEventListener('pointermove',e=>{if(joyActive)setJoy(e)});function resetJoy(){joyActive=false;joyX=joyY=0;stick.style.left='35px';stick.style.top='35px'}joy.addEventListener('pointerup',resetJoy);joy.addEventListener('pointercancel',resetJoy);
function resize(){let w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();
const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.05);if(heroModelMixer)heroModelMixer.update(dt);modelMixers.forEach(m=>m.mixer.update(dt));attackCooldown=Math.max(0,attackCooldown-dt);
let mx=joyX+(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0),mz=joyY+(keys.w||keys.arrowup?-1:0)+(keys.s||keys.arrowdown?1:0);let len=Math.hypot(mx,mz);if(len>1){mx/=len;mz/=len}
if(len>.08){hero.position.x+=mx*5.5*dt;hero.position.z+=mz*5.5*dt;hero.rotation.y=Math.atan2(mx,mz);walk+=dt*10;hero.position.y=Math.abs(Math.sin(walk))*.045;armPivots[0].rotation.x=Math.sin(walk)*.5;armPivots[1].rotation.x=-Math.sin(walk)*.5;legPivots[0].rotation.x=-Math.sin(walk)*.65;legPivots[1].rotation.x=Math.sin(walk)*.65}

hero.position.x=Math.max(-25,Math.min(25,hero.position.x));hero.position.z=Math.max(-25,Math.min(25,hero.position.z));
enemies.forEach(e=>{if(!e.visible)return;let dx=hero.position.x-e.position.x,dz=hero.position.z-e.position.z,d=Math.hypot(dx,dz);e.userData.walk+=dt*(d>2.1?6:2);if(d>2.1){e.position.x+=dx/d*1.1*dt;e.position.z+=dz/d*1.1*dt;e.rotation.y=Math.atan2(dx,dz);const swing=Math.sin(e.userData.walk)*.45;e.userData.legs.forEach((p,i)=>p.rotation.x=i===0?swing:-swing);e.userData.arms.forEach((p,i)=>p.rotation.x=i===0?-swing*.5:swing*.5);e.position.y=Math.abs(Math.sin(e.userData.walk*2))*.018}else{e.userData.cool-=dt;e.userData.arms.forEach((p,i)=>p.rotation.x=i===0?-.65:-.35);if(e.userData.cool<=0){health=Math.max(0,health-5);e.userData.cool=1.2}}});
if(attackAnim>0){attackAnim=Math.max(0,attackAnim-dt);const swing=(.32-attackAnim)/.32;swordGrp.rotation.x=Math.sin(swing*Math.PI)*-1.4;swordGrp.rotation.z=Math.sin(swing*Math.PI)*.45;armPivots[1].rotation.x=-Math.sin(swing*Math.PI)*.9;}else{swordGrp.rotation.x=0;swordGrp.rotation.z=0;armPivots[1].rotation.x=0;}
projectiles=projectiles.filter(p=>{p.mesh.position.add(p.dir.clone().multiplyScalar(p.speed*dt));p.life-=dt;for(const e of enemies){if(!e.visible)continue;const d=e.position.clone().sub(p.mesh.position);d.y=0;if(d.length()<.65){e.userData.hp--;if(e.userData.hp<=0){e.visible=false;defeated++;hud.dataset.notice='Enemy defeated!';}scene.remove(p.mesh);return false;}}if(p.life<=0){scene.remove(p.mesh);return false;}return true;});
let camOffset=new THREE.Vector3(0,6,9).applyAxisAngle(new THREE.Vector3(0,1,0),hero.rotation.y);camera.position.lerp(new THREE.Vector3(hero.position.x+camOffset.x,hero.position.y+camOffset.y,hero.position.z+camOffset.z),.09);camera.lookAt(hero.position.x,hero.position.y+1,hero.position.z);
hud.textContent='Health: '+health+' • Enemies: '+(enemies.filter(e=>e.visible).length)+' • '+weapon.toUpperCase()+(hud.dataset.notice?' • '+hud.dataset.notice:'');if(health<=0)hud.textContent='Game Over — Refresh to restart';if(defeated===3)hud.textContent='Village Clear! • Refresh to play again';
renderer.render(scene,camera)}
loop();
})();
 
}catch(err){show('The 3D game could not start. Refresh the page or try Chrome.');console.error(err);}
}
load(0);
})();
