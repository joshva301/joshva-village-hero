<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Joshva Village Hero</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#182b20;color:#fff;font-family:system-ui,Arial}#game{position:absolute;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}#top{position:absolute;top:8px;left:8px;right:8px;text-align:center;text-shadow:0 2px 4px #000;font-weight:700;pointer-events:none}#title{font-size:18px}#hud{margin-top:6px;font-size:14px}#msg{color:#ffe5a0;min-height:18px;font-size:13px}#controls{position:absolute;bottom:16px;left:14px;right:14px;display:flex;align-items:end;justify-content:space-between;pointer-events:none}#joy{width:128px;height:128px;border:2px solid #d8efcf;background:#365c42aa;border-radius:50%;position:relative;pointer-events:auto;touch-action:none}#nub{position:absolute;left:37px;top:37px;width:50px;height:50px;border-radius:50%;background:#8fce83;border:2px solid #fff}#attack{pointer-events:auto;border:2px solid #fff;border-radius:20px;background:#b64c3e;color:white;font-weight:800;font-size:16px;padding:22px 18px;min-width:92px;touch-action:none}#attack:active{background:#e08052;transform:scale(.96)}#restart{display:none;pointer-events:auto;border:1px solid #fff;border-radius:12px;background:#274c35;color:white;padding:10px 16px;font-weight:700}@media(min-width:800px){#controls{max-width:700px;margin:auto;left:0;right:0}#joy,#attack{opacity:.75}}
</style></head><body><div id="game"></div><div id="top"><div id="title">⚔️ Joshva Village Hero</div><div id="hud">Health: 100 · Enemies: 3</div><div id="msg">Move with joystick · Tap ATTACK to swing</div><button id="restart">Restart</button></div><div id="controls"><div id="joy"><div id="nub"></div></div><button id="attack">⚔️ ATTACK</button></div>
<script>
(()=> {
const root=document.getElementById('game'),hud=document.getElementById('hud'),msg=document.getElementById('msg'),attackBtn=document.getElementById('attack'),restart=document.getElementById('restart');
let game=null;
function fallback(){
 root.innerHTML='<canvas id="fallback" style="width:100%;height:100%"></canvas>';
 const c=document.getElementById('fallback'),ctx=c.getContext('2d');let W,H,px=0,pz=0,hp=100,foes=[[-4,-2],[4,-3],[0,-8]],last=0,move={x:0,y:0},attack=0;
 function size(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio}addEventListener('resize',size);size();
 function draw(t){const dt=Math.min(.04,(t-last)/1000||0);last=t;px+=move.x*dt*4;pz+=move.y*dt*4;ctx.clearRect(0,0,W,H);ctx.fillStyle='#78a957';ctx.fillRect(0,0,W,H);ctx.fillStyle='#c5aa78';ctx.fillRect(W*.43,0,W*.14,H);for(let i=0;i<15;i++){ctx.fillStyle='#4b8743';ctx.beginPath();ctx.arc((i*97%W), (i*53%H),30*devicePixelRatio,0,Math.PI*2);ctx.fill()}
 const scale=36*devicePixelRatio,centerX=W/2,centerY=H*.52;function drawGuy(x,y,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(centerX+x*scale,centerY+y*scale,16*devicePixelRatio,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e9d6a4';ctx.fillRect(centerX+x*scale-9*devicePixelRatio,centerY+y*scale-14*devicePixelRatio,18*devicePixelRatio,8*devicePixelRatio)}
 foes=foes.filter(e=>{const dx=px-e[0],dy=pz-e[1],d=Math.hypot(dx,dy);if(d>1.4){e[0]+=dx/(d||1)*dt*.65;e[1]+=dy/(d||1)*dt*.65}drawGuy(e[0]-px,e[1]-pz,'#8c6548');return true});drawGuy(0,0,'#405f91');if(attack>0){ctx.strokeStyle='#fff0a0';ctx.lineWidth=5*devicePixelRatio;ctx.beginPath();ctx.arc(centerX,centerY,40*devicePixelRatio,-1,1);ctx.stroke();attack-=dt}hud.textContent='Health: '+hp+' · Enemies: '+foes.length;requestAnimationFrame(draw)}requestAnimationFrame(draw);
 function hit(){attack=.25;let idx=foes.findIndex(e=>Math.hypot(e[0]-px,e[1]-pz)<2);if(idx>=0){foes.splice(idx,1);msg.textContent='Enemy defeated!'}else msg.textContent='Move closer to an enemy'}attackBtn.onclick=hit;restart.onclick=()=>location.reload();
}
function loadThree(){const urls=['https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js','https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js'];let i=0;function next(){if(i>=urls.length){msg.textContent='3D unavailable; running lightweight fallback';fallback();return}const s=document.createElement('script');s.src=urls[i++];s.onload=()=>window.THREE?start():next();s.onerror=next;document.head.appendChild(s)}next()}
function start(){
try{
root.innerHTML='';const THREE=window.THREE;const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bd5f4);scene.fog=new THREE.Fog(0x9bd5f4,22,55);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);camera.position.set(0,12,12);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x4c6741,2));const sun=new THREE.DirectionalLight(0xfff1d8,2);sun.position.set(-8,16,7);sun.castShadow=true;scene.add(sun);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.8});
const grass=mat(0x75a956),pathmat=mat(0xc6aa79),wood=mat(0x75492c),roof=mat(0x934638),wall=mat(0xe0c69b),leaf=mat(0x347a3b),armor=mat(0x425c80),silver=mat(0xc5d1dc),skin=mat(0xc98e64),dark=mat(0x30343a),cloth=mat(0x702d3b),gold=mat(0xd5a647);
function mesh(g,m,x,y,z){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
function box(parent,x,y,z,a,b,c,m){const o=new THREE.Mesh(new THREE.BoxGeometry(a,b,c),m);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o}
function sphere(parent,x,y,z,r,m){const o=new THREE.Mesh(new THREE.SphereGeometry(r,12,10),m);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o}
mesh(new THREE.PlaneGeometry(70,70),grass,0,-.08,0).rotation.x=-Math.PI/2;
const road=mesh(new THREE.PlaneGeometry(5,60),pathmat,0,0,0);road.rotation.x=-Math.PI/2;
function house(x,z){box(scene,x,1,z,3.6,2,3,wall);const r=mesh(new THREE.ConeGeometry(2.8,1.5,4),roof,x,2.7,z);r.rotation.y=Math.PI/4;box(scene,x,.9,z+1.53,.8,1.7,.12,wood);box(scene,x-1,1.35,z+1.55,.55,.55,.12,mat(0x8fc7d9));box(scene,x+1,1.35,z+1.55,.55,.55,.12,mat(0x8fc7d9))}
house(-9,-9);house(9,-13);house(-12,12);house(12,12);
for(let i=0;i<24;i++){const x=(Math.random()-.5)*44,z=(Math.random()-.5)*44;if(Math.abs(x)<3)continue;const trunk=mesh(new THREE.CylinderGeometry(.18,.3,2,8),wood,x,1,z);const crown=mesh(new THREE.SphereGeometry(1.3,10,8),leaf,x,2.8,z);crown.scale.y=1.3}
const hero=new THREE.Group();scene.add(hero);
box(hero,0,1.05,0,.62,.75,.4,armor);box(hero,0,.72,.03,.55,.28,.36,cloth);box(hero,0,1.3,.2,.48,.22,.1,silver);box(hero,0,1.05,.24,.12,.1,.08,gold);
sphere(hero,0,1.8,0,.24,skin);sphere(hero,0,1.95,-.03,.25,dark);box(hero,0,1.99,.04,.36,.08,.3,gold);
for(const s of [-1,1]){box(hero,s*.34,1.42,0,.25,.25,.28,silver);box(hero,s*.36,1.15,.1,.13,.32,.13,armor);box(hero,s*.15,.4,0,.22,.5,.2,dark);box(hero,s*.15,.18,.12,.28,.14,.32,wood)}
const sword=new THREE.Group();hero.add(sword);box(sword,0,-.16,0,.08,.2,.08,wood);box(sword,0,.2,0,.06,.5,.04,silver);box(sword,0,-.02,0,.26,.05,.08,gold);sword.position.set(.48,1.2,.2);
const enemies=[];function enemy(x,z){const g=new THREE.Group();scene.add(g);box(g,0,.9,0,.5,.65,.36,mat(0x68503a));box(g,0,1.25,.1,.4,.3,.18,mat(0x887454));sphere(g,0,1.5,.02,.22,skin);sphere(g,0,1.63,-.03,.23,dark);for(const s of [-1,1]){box(g,s*.2,.38,0,.13,.4,.14,dark);box(g,s*.32,.95,0,.12,.42,.12,mat(0x655b49))}g.position.set(x,0,z);g.userData.hp=3;g.userData.cool=0;g.userData.phase=Math.random()*6;enemies.push(g)}enemy(-6,1);enemy(6,1);enemy(0,-12);
let health=100,defeated=0,dir={x:0,z:1},move={x:0,y:0},attackCd=0,swing=0,keys={};let last=performance.now();
function attack(){if(attackCd>0||health<=0)return;attackCd=.45;swing=.3;let target=null,dist=2.2;for(const e of enemies){if(!e.visible)continue;const dx=e.position.x-hero.position.x,dz=e.position.z-hero.position.z,d=Math.hypot(dx,dz);const facing=dx*dir.x+dz*dir.z;if(d<dist&&facing>-.2){target=e;dist=d}}if(target){target.userData.hp--;msg.textContent=target.userData.hp<=0?'Enemy defeated!':'Hit!';if(target.userData.hp<=0){target.visible=false;defeated++}}else msg.textContent='No enemy in range — move closer and face them'}
attackBtn.onpointerdown=e=>{e.preventDefault();attackBtn.setPointerCapture(e.pointerId);attack()};attackBtn.onpointerup=()=>{};attackBtn.onclick=e=>e.preventDefault();
const joy=document.getElementById('joy'),nub=document.getElementById('nub');function setJoy(e){const r=joy.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,d=Math.hypot(x,y),max=38;if(d>max){move.x=x/d;move.y=y/d}else{move.x=x/max;move.y=y/max}nub.style.left=(37+x)+'px';nub.style.top=(37+y)+'px'}joy.onpointerdown=e=>{joy.setPointerCapture(e.pointerId);setJoy(e)};joy.onpointermove=e=>{if(joy.hasPointerCapture(e.pointerId))setJoy(e)};function resetJoy(){move.x=move.y=0;nub.style.left='37px';nub.style.top='37px'}joy.onpointerup=resetJoy;joy.onpointercancel=resetJoy;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();attack()}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function tick(){requestAnimationFrame(tick);const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;attackCd=Math.max(0,attackCd-dt);
let mx=move.x+(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0),mz=move.y+(keys.w||keys.arrowup?-1:0)+(keys.s||keys.arrowdown?1:0);const l=Math.hypot(mx,mz);if(l>1){mx/=l;mz/=l}
if(l>.08){hero.position.x+=mx*5*dt;hero.position.z+=mz*5*dt;dir={x:mx,z:mz};hero.rotation.y=Math.atan2(mx,mz)}
hero.position.x=Math.max(-24,Math.min(24,hero.position.x));hero.position.z=Math.max(-24,Math.min(24,hero.position.z));
for(const e of enemies){if(!e.visible)continue;const dx=hero.position.x-e.position.x,dz=hero.position.z-e.position.z,d=Math.hypot(dx,dz);e.userData.phase+=dt*5;if(d>1.5){e.position.x+=dx/(d||1)*1.25*dt;e.position.z+=dz/(d||1)*1.25*dt;e.rotation.y=Math.atan2(dx,dz)}else{e.userData.cool-=dt;if(e.userData.cool<=0){health=Math.max(0,health-5);e.userData.cool=1.25}}}
if(swing>0){swing-=dt;sword.rotation.z=Math.sin((.3-swing)/.3*Math.PI)*-1.4}else sword.rotation.z=0;
camera.position.lerp(new THREE.Vector3(hero.position.x,11,hero.position.z+11),.08);camera.lookAt(hero.position.x,0,hero.position.z);hud.textContent='Health: '+health+' · Enemies: '+enemies.filter(e=>e.visible).length;
if(health<=0){msg.textContent='Game over — press Restart';restart.style.display='inline-block';attackBtn.disabled=true}else if(defeated===3){msg.textContent='Village cleared!';restart.style.display='inline-block';attackBtn.disabled=true}
renderer.render(scene,camera)}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});restart.onclick=()=>location.reload();tick();
}catch(err){console.error(err);msg.textContent='3D setup failed; loading fallback';fallback()}
}
loadThree();
})();
</script></body></html>
