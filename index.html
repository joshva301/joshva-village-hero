<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Joshva Village Hero — Realistic 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#172b20;color:#fff;font-family:Arial,sans-serif;text-align:center;overflow:hidden}
h2{margin:8px 0;font-size:20px}.help{font-size:12px;margin:4px 0 8px}
#game{width:100vw;height:calc(100vh - 112px);display:block;touch-action:none}
#hud{position:absolute;top:48px;left:0;right:0;pointer-events:none;text-shadow:0 2px 3px #000;font-weight:bold}
#controls{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 18px;pointer-events:none}
#joystick{width:130px;height:130px;border-radius:50%;background:#294b32bb;border:3px solid #c8e5c5;position:relative;touch-action:none;pointer-events:auto}
#stick{width:54px;height:54px;border-radius:50%;background:#82c879;border:3px solid white;position:absolute;left:35px;top:35px}
#buttons{display:flex;gap:10px;pointer-events:auto}
button{color:white;font-weight:bold;border:2px solid white;border-radius:16px;background:#315d3b;padding:12px 16px;font-size:14px;touch-action:none}
button.active{background:#b87922;border-color:#ffe29a}
#attack{background:#a63d35;min-width:74px}
#weapon{background:#3874a8;min-width:74px}
@media(min-width:700px){#controls{display:none}.help{font-size:14px}}
</style>
</head>
<body>
<h2>⚔️ Joshva Village Hero — 3D</h2>
<p class="help">Move: WASD / Arrow keys • Attack: Space • Switch: 1 / 2</p>
<div id="game"></div><div id="hud">Health: 100 • Enemies: 3 • Sword</div>
<div id="controls"><div id="joystick"><div id="stick"></div></div><div id="buttons"><button id="weapon">🏹 BOW</button><button id="attack">⚔️ ATTACK</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=> {
const host=document.getElementById('game'),hud=document.getElementById('hud');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bd4f4);scene.fog=new THREE.Fog(0x9bd4f4,22,70);
const camera=new THREE.PerspectiveCamera(58,1,.1,120);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe4f4ff,0x55703b,1.5));
const sun=new THREE.DirectionalLight(0xfff1d6,2.1);sun.position.set(-12,22,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-28;sun.shadow.camera.right=28;sun.shadow.camera.top=28;sun.shadow.camera.bottom=-28;sun.shadow.bias=-0.0004;scene.add(sun);
const mat=(color,rough=1)=>new THREE.MeshStandardMaterial({color,roughness:rough});
const grass=mat(0x64a84e),pathmat=mat(0xc6aa78),wood=mat(0x81532f),roof=mat(0x9a4936),plaster=mat(0xe1c797),leaf=mat(0x2e783d),leaf2=mat(0x4b9948),stone=mat(0x87917d);
function box(x,y,z,sx,sy,sz,m){const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
function sphere(x,y,z,r,m){const o=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),m);o.position.set(x,y,z);o.castShadow=true;scene.add(o);return o}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),grass);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const groundCanvas=document.createElement('canvas');groundCanvas.width=groundCanvas.height=256;const gc=groundCanvas.getContext('2d');gc.fillStyle='#79a957';gc.fillRect(0,0,256,256);for(let i=0;i<1800;i++){gc.fillStyle=['#6d9d4b','#87b35d','#557e3d','#a0bd70'][Math.floor(Math.random()*4)];gc.globalAlpha=.22+Math.random()*.25;gc.fillRect(Math.random()*256,Math.random()*256,1+Math.random()*3,1+Math.random()*3)}gc.globalAlpha=1;const groundTex=new THREE.CanvasTexture(groundCanvas);groundTex.wrapS=groundTex.wrapT=THREE.RepeatWrapping;groundTex.repeat.set(8,8);grass.map=groundTex;grass.color.set(0xffffff);
const path=new THREE.Mesh(new THREE.PlaneGeometry(5,65),pathmat);path.rotation.x=-Math.PI/2;path.position.set(0,.012,0);scene.add(path);
const pathCanvas=document.createElement('canvas');pathCanvas.width=pathCanvas.height=256;const pc=pathCanvas.getContext('2d');pc.fillStyle='#c6aa78';pc.fillRect(0,0,256,256);for(let i=0;i<900;i++){pc.fillStyle=['#ad9264','#d5bd8f','#927b56'][Math.floor(Math.random()*3)];pc.globalAlpha=.2+Math.random()*.35;pc.fillRect(Math.random()*256,Math.random()*256,2+Math.random()*5,1+Math.random()*3)}pc.globalAlpha=1;const pathTex=new THREE.CanvasTexture(pathCanvas);pathTex.wrapS=pathTex.wrapT=THREE.RepeatWrapping;pathTex.repeat.set(1,12);pathmat.map=pathTex;
for(let i=0;i<80;i++){let x=(Math.random()-0.5)*46,z=(Math.random()-0.5)*50;if(Math.abs(x)<3)continue;let peb=new THREE.Mesh(new THREE.SphereGeometry(.08+Math.random()*.13,6,5),stone);peb.position.set(x,.06,z);peb.scale.y=.4;scene.add(peb)}
function tree(x,z){box(x,.8,z,.35,1.6,.35,wood);for(let k=0;k<3;k++){let t=new THREE.Mesh(new THREE.ConeGeometry(1.15-k*.18,1.7,7),k===1?leaf2:leaf);t.position.set(x,1.6+k*.65,z);t.castShadow=true;scene.add(t)}}
function house(x,z){box(x,1.2,z,4,2.4,3.4,plaster);let r=new THREE.Mesh(new THREE.ConeGeometry(3.05,1.65,4),roof);r.rotation.y=Math.PI/4;r.position.set(x,2.7,z);r.castShadow=true;scene.add(r);box(x,0.9,z+1.73,.85,1.8,.12,wood);box(x-1.15,1.45,z+1.76,.7,.65,.12,mat(0x8bc4d4));box(x+1.15,1.45,z+1.76,.7,.65,.12,mat(0x8bc4d4));for(let side of [-1,1]){box(x+side*1.65,1.2,z+1.76,.08,2.35,.08,wood)}box(x,2.35,z+1.77,1.1,.12,.12,wood);}
house(-10,-9);house(10,-13);house(-12,12);house(12,13);
for(const p of [[-18,-18],[-16,3],[-19,16],[18,-5],[17,18],[8,22],[-7,24],[23,7],[6,-24],[-23,-5]])tree(...p);
for(let i=0;i<12;i++){box(-5+i*.9,.45,8,.12,.9,.12,wood);box(-5+i*.9,.45,10,.12,.9,.12,wood)}box(0,.8,9,11,.12,.12,wood);
const hero=new THREE.Group();scene.add(hero);
const armor=mat(0x536e91),silver=mat(0xbecbd7),skin=mat(0xe3b486),dark=mat(0x293647),gold=mat(0xd9b04c);
function part(parent,g,m,x,y,z){let o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o}
part(hero,new THREE.BoxGeometry(.65,.85,.38),armor,0,1.15,0);part(hero,new THREE.BoxGeometry(.55,.45,.4),silver,0,1.3,.04);part(hero,new THREE.SphereGeometry(.27,12,10),skin,0,1.85,0);part(hero,new THREE.SphereGeometry(.28,10,8),dark,0,2.03,-.04);
part(hero,new THREE.BoxGeometry(.48,.08,.45),gold,0,1.72,0);
const limbs=[];
for(let side of [-1,1]){part(hero,new THREE.SphereGeometry(.16,12,8),silver,side*.39,1.48,0);let arm=part(hero,new THREE.BoxGeometry(.18,.48,.18),skin,side*.46,1.15,0);arm.rotation.z=side*.2;limbs.push(arm);part(hero,new THREE.BoxGeometry(.2,.48,.2),dark,side*.22,.4,0);part(hero,new THREE.BoxGeometry(.24,.22,.25),armor,side*.22,.58,.02);}
const swordGrp=new THREE.Group();hero.add(swordGrp);part(swordGrp,new THREE.BoxGeometry(.08,.55,.09),wood,0,-.18,0);part(swordGrp,new THREE.BoxGeometry(.08,.7,.06),silver,0,.35,0);part(swordGrp,new THREE.BoxGeometry(.36,.08,.1),gold,0,-.02,0);swordGrp.position.set(.55,1.2,.22);
const bowGrp=new THREE.Group();hero.add(bowGrp);let bow=part(bowGrp,new THREE.TorusGeometry(.42,.035,8,18,Math.PI),wood,0,0,0);bow.rotation.z=Math.PI/2;let string=part(bowGrp,new THREE.CylinderGeometry(.015,.015,.78,5),silver,0,0,0);string.rotation.z=Math.PI/2;bowGrp.position.set(.56,1.15,.2);bowGrp.visible=false;
const enemies=[];function enemy(x,z){let g=new THREE.Group();scene.add(g);part(g,new THREE.SphereGeometry(.28,14,10),mat(0x7e9f52),0,1.42,0);part(g,new THREE.BoxGeometry(.5,.62,.36),mat(0x55763b),0,.85,0);part(g,new THREE.BoxGeometry(.42,.12,.38),mat(0x8e6a43),0,1.12,.02);for(let s of [-1,1]){part(g,new THREE.BoxGeometry(.15,.45,.15),mat(0x4b5b32),s*.2,.35,0);part(g,new THREE.BoxGeometry(.12,.45,.12),mat(0x7e9f52),s*.4,.9,0)}g.position.set(x,0,z);g.userData.hp=3;g.userData.cool=0;enemies.push(g)}enemy(-8,2);enemy(9,2);enemy(0,-17);
let weapon='sword',joyX=0,joyY=0,joyActive=false,keys={},attackCooldown=0,hitFlash=0,health=100,defeated=0,walk=0,attackAnim=0,projectiles=[];
function selectWeapon(){weapon=weapon==='sword'?'bow':'sword';swordGrp.visible=weapon==='sword';bowGrp.visible=weapon==='bow';document.getElementById('weapon').textContent=weapon==='sword'?'🏹 BOW':'⚔️ SWORD'}
document.getElementById('weapon').onclick=selectWeapon;
function attack(){if(attackCooldown>0||health<=0||defeated>=3)return;attackCooldown=.38;attackAnim=.32;
if(weapon==='sword'){let hit=false;enemies.forEach(e=>{if(e.visible&&e.position.distanceTo(hero.position)<2.7){e.userData.hp--;hit=true;if(e.userData.hp<=0){e.visible=false;defeated++}}});hud.dataset.notice=hit?'Hit!':'Swing!';}
else{let target=null;let best=15;enemies.forEach(e=>{if(!e.visible)return;let d=e.position.distanceTo(hero.position);if(d<best){best=d;target=e}});if(target){const orb=new THREE.Mesh(new THREE.SphereGeometry(.09,8,8),new THREE.MeshBasicMaterial({color:0xffe9a6}));orb.position.copy(hero.position);orb.position.y=1.25;scene.add(orb);projectiles.push({mesh:orb,target,speed:18});hud.dataset.notice='Arrow fired!';}else hud.dataset.notice='No target nearby';}
}
const attackBtn=document.getElementById('attack');attackBtn.addEventListener('pointerdown',e=>{e.preventDefault();attack();});attackBtn.addEventListener('click',e=>{e.preventDefault();});window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();attack()}if(e.key==='1'&&weapon!=='sword')selectWeapon();if(e.key==='2'&&weapon!=='bow')selectWeapon()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const joy=document.getElementById('joystick'),stick=document.getElementById('stick');function setJoy(e){const r=joy.getBoundingClientRect();let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;let d=Math.hypot(x,y),max=38;if(d>max){x=x/d*max;y=y/d*max}joyX=x/max;joyY=y/max;stick.style.left=35+x+'px';stick.style.top=35+y+'px'}joy.addEventListener('pointerdown',e=>{joyActive=true;joy.setPointerCapture(e.pointerId);setJoy(e)});joy.addEventListener('pointermove',e=>{if(joyActive)setJoy(e)});function resetJoy(){joyActive=false;joyX=joyY=0;stick.style.left='35px';stick.style.top='35px'}joy.addEventListener('pointerup',resetJoy);joy.addEventListener('pointercancel',resetJoy);
function resize(){let w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();
const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.05);attackCooldown=Math.max(0,attackCooldown-dt);
let mx=joyX+(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0),mz=joyY+(keys.w||keys.arrowup?-1:0)+(keys.s||keys.arrowdown?1:0);let len=Math.hypot(mx,mz);if(len>1){mx/=len;mz/=len}
if(len>.08){hero.position.x+=mx*5*dt;hero.position.z+=mz*5*dt;hero.rotation.y=Math.atan2(mx,mz);walk+=dt*10;hero.position.y=Math.abs(Math.sin(walk))*.08;limbs.forEach((a,i)=>a.rotation.x=Math.sin(walk+(i*Math.PI))*0.45)}
hero.position.x=Math.max(-25,Math.min(25,hero.position.x));hero.position.z=Math.max(-25,Math.min(25,hero.position.z));
enemies.forEach(e=>{if(!e.visible)return;let dx=hero.position.x-e.position.x,dz=hero.position.z-e.position.z,d=Math.hypot(dx,dz);if(d>2.1){e.position.x+=dx/d*1.1*dt;e.position.z+=dz/d*1.1*dt;e.rotation.y=Math.atan2(dx,dz)}else{e.userData.cool-=dt;if(e.userData.cool<=0){health=Math.max(0,health-5);e.userData.cool=1.2}}});
if(attackAnim>0){attackAnim=Math.max(0,attackAnim-dt);const swing=(.32-attackAnim)/.32;swordGrp.rotation.x=Math.sin(swing*Math.PI)*-1.4;swordGrp.rotation.z=Math.sin(swing*Math.PI)*.45;limbs[1].rotation.x=-Math.sin(swing*Math.PI)*.9;}else{swordGrp.rotation.x=0;swordGrp.rotation.z=0;limbs[1].rotation.x=0;}
projectiles=projectiles.filter(p=>{if(!p.target.visible){scene.remove(p.mesh);return false;}const destination=p.target.position.clone();destination.y=1.15;const delta=destination.sub(p.mesh.position);if(delta.length()<.45){p.target.userData.hp--;if(p.target.userData.hp<=0){p.target.visible=false;defeated++;}scene.remove(p.mesh);return false;}p.mesh.position.add(delta.normalize().multiplyScalar(p.speed*dt));return true;});
let camOffset=new THREE.Vector3(0,6,9).applyAxisAngle(new THREE.Vector3(0,1,0),hero.rotation.y);camera.position.lerp(new THREE.Vector3(hero.position.x+camOffset.x,hero.position.y+camOffset.y,hero.position.z+camOffset.z),.09);camera.lookAt(hero.position.x,hero.position.y+1,hero.position.z);
hud.textContent='Health: '+health+' • Enemies: '+(enemies.filter(e=>e.visible).length)+' • '+weapon.toUpperCase()+(hud.dataset.notice?' • '+hud.dataset.notice:'');if(health<=0)hud.textContent='Game Over — Refresh to restart';if(defeated===3)hud.textContent='Village Clear! • Refresh to play again';
renderer.render(scene,camera)}
loop();
})();
</script>
</body>
</html>
