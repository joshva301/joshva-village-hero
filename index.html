<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Joshva Village Hero</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px 8px 28px;background:#172b20;color:#fff;text-align:center;font-family:Arial,sans-serif;touch-action:manipulation}
h2{margin:8px 0}.help{margin:8px 0 12px}canvas{display:block;width:min(600px,96vw);height:auto;margin:0 auto;background:#70a94b;border:4px solid white;border-radius:6px;touch-action:none}
#score{margin:12px 0}.weapons{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px auto;width:min(600px,96vw)}
button{color:white;font-weight:bold;cursor:pointer}.weapon{border:2px solid #dcebd8;border-radius:10px;background:#315d3b;padding:10px 14px;font-size:15px}.weapon.selected{background:#b87922;border-color:#ffe29a;box-shadow:0 0 0 2px #ffe29a}
#controls{width:min(420px,96vw);margin:12px auto 0;display:flex;align-items:center;justify-content:space-between;gap:18px;user-select:none;-webkit-user-select:none}
#pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,54px);gap:5px}
.control-btn{border:2px solid #e9f5e8;border-radius:13px;background:#315d3b;font-size:25px;box-shadow:0 3px 0 #183522;touch-action:none}
.control-btn:active{background:#548b4e;transform:translateY(2px)}#up{grid-column:2;grid-row:1}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
#attack{width:108px;height:86px;border-radius:50%;background:#9c382e;font-size:17px}.note{font-size:13px;opacity:.85;margin-top:10px}
@media(min-width:700px){#controls{display:none}}
</style>
</head>
<body>
<h2>⚔️ Joshva Village Hero</h2>
<p class="help">Move: Arrow Keys / WASD | Select weapon: 1, 2, 3 | Attack: Space</p>
<canvas id="game" width="600" height="400"></canvas>
<div class="weapons" aria-label="Choose weapon">
<button class="weapon selected" data-weapon="sword">⚔️ Sword (1)</button>
<button class="weapon" data-weapon="bow">🏹 Bow (2)</button>
<button class="weapon" data-weapon="magic">✨ Magic (3)</button>
</div>
<h3 id="score">Health: 100 | Enemies defeated: 0</h3>
<div id="controls" aria-label="Touch game controls">
<div id="pad">
<button class="control-btn" id="up" data-key="arrowup" aria-label="Move up">▲</button>
<button class="control-btn" id="left" data-key="arrowleft" aria-label="Move left">◀</button>
<button class="control-btn" id="down" data-key="arrowdown" aria-label="Move down">▼</button>
<button class="control-btn" id="right" data-key="arrowright" aria-label="Move right">▶</button>
</div>
<button class="control-btn" id="attack" aria-label="Attack">⚔️<br>ATTACK</button>
</div>
<p class="note">Choose Sword, Bow or Magic, then tap ATTACK. On computer use keys 1, 2, 3 and Space.</p>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
const player={x:300,y:200,h:100};
let enemies=[],keys={},score=0,weapon="sword",attackFlash=0;
function resetEnemies(){enemies=[];for(let i=0;i<5;i++)enemies.push({x:65+i*115,y:75+(i%2)*235,h:2});score=0}
resetEnemies();
function chooseWeapon(name){
 weapon=name;
 document.querySelectorAll(".weapon").forEach(b=>b.classList.toggle("selected",b.dataset.weapon===name));
}
document.querySelectorAll(".weapon").forEach(b=>b.addEventListener("click",()=>chooseWeapon(b.dataset.weapon)));
document.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault();
 keys[k===" "?"space":k]=true;
 if(!e.repeat&&e.key==="1")chooseWeapon("sword");
 if(!e.repeat&&e.key==="2")chooseWeapon("bow");
 if(!e.repeat&&e.key==="3")chooseWeapon("magic");
 if(e.code==="Space"&&!e.repeat)attack();
});
document.addEventListener("keyup",e=>{const k=e.key.toLowerCase();keys[k===" "?"space":k]=false});
document.querySelectorAll("[data-key]").forEach(b=>{
 const k=b.dataset.key,release=e=>{e.preventDefault();keys[k]=false};
 b.addEventListener("pointerdown",e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});
 b.addEventListener("pointerup",release);b.addEventListener("pointercancel",release);
 b.addEventListener("lostpointercapture",()=>keys[k]=false);
});
document.getElementById("attack").addEventListener("pointerdown",e=>{e.preventDefault();attack()});
function attack(){
 if(!enemies.length)return;
 attackFlash=12;
 const range=weapon==="sword"?68:weapon==="bow"?230:145;
 const damage=weapon==="sword"?2:weapon==="bow"?1:2;
 // Bow hits the nearest enemy in range; Magic damages every enemy in its area.
 if(weapon==="bow"){
  const target=enemies.filter(m=>Math.hypot(m.x-player.x,m.y-player.y)<range).sort((a,b)=>Math.hypot(a.x-player.x,a.y-player.y)-Math.hypot(b.x-player.x,b.y-player.y))[0];
  if(target)target.h-=damage;
 }else{
  enemies.forEach(m=>{if(Math.hypot(m.x-player.x,m.y-player.y)<range)m.h-=damage});
 }
 enemies=enemies.filter(m=>m.h>0);score=5-enemies.length;
}
function draw(){
 ctx.clearRect(0,0,600,400);ctx.fillStyle="#397d38";ctx.fillRect(0,0,600,400);
 ctx.fillStyle="#d9c18b";ctx.fillRect(0,0,600,35);ctx.fillRect(0,365,600,35);
 ctx.font="30px Arial";ctx.fillText("🏡",40,90);ctx.fillText("🌳",500,100);ctx.fillText("🌳",80,330);
 enemies.forEach(m=>{ctx.font="30px Arial";ctx.fillText("👹",m.x-12,m.y+10);ctx.font="12px Arial";ctx.fillStyle="#fff";ctx.fillText("HP "+m.h,m.x-12,m.y-12);ctx.fillStyle="#397d38"});
 ctx.font="30px Arial";ctx.fillText("🧑",player.x-15,player.y+10);
 ctx.fillStyle="#fff";ctx.font="18px Arial";ctx.fillText("Joshva",player.x-25,player.y-15);
 if(attackFlash>0){ctx.font="27px Arial";ctx.fillText(weapon==="sword"?"⚔️":weapon==="bow"?"➶":"✨",player.x+18,player.y-5);attackFlash--}
 document.getElementById("score").innerText="Health: "+player.h+" | Enemies defeated: "+score+" | Weapon: "+weapon.toUpperCase();
 if(enemies.length===0){ctx.fillStyle="#fff";ctx.font="35px Arial";ctx.fillText("YOU WIN!",220,200);ctx.font="17px Arial";ctx.fillText("Refresh to play again",210,230)}
}
function update(){
 if(keys.arrowup||keys.w)player.y-=3;if(keys.arrowdown||keys.s)player.y+=3;
 if(keys.arrowleft||keys.a)player.x-=3;if(keys.arrowright||keys.d)player.x+=3;
 player.x=Math.max(20,Math.min(580,player.x));player.y=Math.max(50,Math.min(350,player.y));
 draw();requestAnimationFrame(update);
}
update();
</script>
</body>
</html>
