<!DOCTYPE html>
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sky Jump Adventure</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#77c8ff;font-family:system-ui,Arial;color:white;touch-action:none}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 4px #31516a}
#top{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 14px;font-weight:800;font-size:14px}
#brand{font-size:18px}#stats{text-align:right}
#message{position:absolute;top:24%;width:100%;text-align:center;font-size:clamp(18px,5vw,28px);font-weight:900}
#menu{pointer-events:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#ffffffdd;color:#21435a;border:3px solid white;border-radius:24px;padding:20px;width:min(88%,360px);text-align:center;box-shadow:0 12px 30px #28628a55}
#menu h1{margin:0 0 8px;font-size:27px}#menu p{margin:8px 0 16px;line-height:1.4}
button{font:inherit;font-weight:900;border:0;border-radius:18px;color:white;background:linear-gradient(#ffbb42,#ff8d29);box-shadow:0 4px 0 #bd6720;touch-action:none}
#start{padding:13px 30px;font-size:19px;background:linear-gradient(#35c9a0,#159b78);box-shadow:0 4px 0 #087257}
#controls{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 16px;pointer-events:none}
#leftRight{display:flex;gap:10px;pointer-events:auto}
.ctrl{width:68px;height:68px;font-size:26px;background:#376e9dbb;border:2px solid #ffffffaa;box-shadow:0 4px 0 #1b4569}
#jump{width:90px;height:90px;font-size:17px;background:linear-gradient(#ff9b56,#f16a35);border:3px solid white;box-shadow:0 5px 0 #a84622}
#controls.hidden{display:none}
#hint{position:absolute;bottom:118px;width:100%;text-align:center;font-size:12px;opacity:.85}
@media(min-width:700px){#controls{max-width:620px;margin:auto} .ctrl{width:76px;height:76px}#jump{width:100px;height:100px}}
</style></head><body>
<canvas id="c"></canvas><div id="ui">
<div id="top"><div id="brand">☁️ SKY JUMP</div><div id="stats">🪙 0<br>LEVEL 1</div></div>
<div id="message"></div><div id="hint">Hold ◀ ▶ to steer · Tap JUMP to leap</div>
<div id="menu"><h1>🏝️ Sky Jump Adventure</h1><p>Run across floating islands, collect coins, dodge moving platforms and reach the sky!</p><p>✨ Double jump · 💎 Power-ups · 🏆 5 levels</p><button id="start">START ADVENTURE</button></div>
<div id="controls" class="hidden"><div id="leftRight"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div><button id="jump">⬆ JUMP</button></div>
</div>
<script>
(()=>{
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),menu=document.getElementById('menu'),controls=document.getElementById('controls'),msg=document.getElementById('message'),stats=document.getElementById('stats');
let W,H,D=1,game=false,paused=false,player,plats=[],coins=[],gems=[],clouds=[],particles=[],score=0,level=1,dist=0,best=0,keys={},touch={x:0},last=0,sound=true,camZ=0,camX=0,toast='',toastTime=0;
try{best=+localStorage.skyjumpBest||0}catch(e){}
function resize(){D=Math.min(devicePixelRatio||1,1.7);W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function reset(){player={x:0,z:0,y:0,vy:0,ground:true,jumps:0,dead:false,shield:0};plats=[];coins=[];gems=[];particles=[];score=0;level=1;dist=0;camZ=-7;camX=0;for(let i=0;i<12;i++)addPlatform(i===0?0:rand(-3.5,3.5),i*8, i===0?5:rand(3.3,4.5),i===0?6:rand(3.3,4.2),i>2&&i%4===0?'moving':'normal');}
function addPlatform(x,z,w,d,type='normal'){plats.push({x,z,w,d,type,baseX:x,phase:rand(0,6),top:.1});if(Math.random()<.75&&z>3){for(let k=0;k<3;k++)coins.push({x:x+(k-1)*.48,z:z+rand(-.4,.4),y:1.1,got:false})}if(Math.random()<.09)gems.push({x,z,y:1.25,got:false})}
function ensureWorld(){let max=plats.reduce((m,p)=>Math.max(m,p.z),0);while(max<player.z+85){max+=rand(6.5,9.2);addPlatform(rand(-4.2,4.2),max,rand(3.2,4.5),rand(3.2,4.4),Math.random()<.22?'moving':'normal')}}
function project(x,y,z){let depth=z-camZ+13;let s=480/(depth+480);return{x:W/2+(x-camX)*s*68,y:H*.53+(13-depth*.27)*s*68-y*s*68,s}}
function poly(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke()}}
function drawPlatform(p){let x=p.x;if(p.type==='moving')x=p.x+Math.sin(p.phase)*1.3;const a=project(x-p.w/2,0,p.z-p.d/2),b=project(x+p.w/2,0,p.z-p.d/2),c=project(x+p.w/2,0,p.z+p.d/2),d=project(x-p.w/2,0,p.z+p.d/2);poly([d,c,{x:c.x,y:c.y+9*c.s},{x:d.x,y:d.y+9*d.s}],'#7d5b48');poly([a,b,c,d],p.type==='moving'?'#76d7e8':'#78c85b','#e7fff0');poly([project(x-p.w*.46,.08,p.z-p.d*.42),project(x+p.w*.46,.08,p.z-p.d*.42),project(x+p.w*.46,.08,p.z+p.d*.42),project(x-p.w*.46,.08,p.z+p.d*.42)],p.type==='moving'?'#48a9c5':'#54a344');}
function drawCloud(cl){const p=project(cl.x,cl.y,cl.z);ctx.globalAlpha=.45;ctx.fillStyle='white';ctx.beginPath();ctx.ellipse(p.x,p.y,cl.s*p.s,cl.s*.38*p.s,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
function drawCoin(o){if(o.got)return;let p=project(o.x,o.y,o.z);ctx.save();ctx.translate(p.x,p.y);ctx.scale(p.s, p.s);ctx.fillStyle='#ffd63d';ctx.strokeStyle='#fff4a6';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,8,11,Math.sin(performance.now()/250)*.5,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#c98118';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText('$',0,4);ctx.restore()}
function drawGem(o){if(o.got)return;const p=project(o.x,o.y+Math.sin(performance.now()/300)*.15,o.z);ctx.save();ctx.translate(p.x,p.y);ctx.scale(p.s,p.s);poly([{x:0,y:-12},{x:9,y:-2},{x:0,y:12},{x:-9,y:-2}],'#45f0ff','#fff');ctx.restore()}
function drawPlayer(){let p=project(player.x,player.y+1.1,player.z);const s=p.s;ctx.save();ctx.translate(p.x,p.y);ctx.scale(s,s);if(!player.ground)ctx.rotate(Math.sin(performance.now()/80)*.08);ctx.fillStyle='#263c62';ctx.beginPath();ctx.ellipse(0,17,12,4,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#3165ac';ctx.fillRect(-9,-3,18,22);ctx.fillStyle='#ffce9a';ctx.beginPath();ctx.arc(0,-14,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4b3328';ctx.beginPath();ctx.arc(0,-18,9,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-6,-16,3,3);ctx.fillRect(3,-16,3,3);ctx.fillStyle='#f7d44e';ctx.fillRect(-11,0,22,4);ctx.fillStyle='#263c62';ctx.fillRect(-7,17,5,10);ctx.fillRect(2,17,5,10);ctx.restore()}
function drawSky(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5ab6ff');g.addColorStop(.58,'#bceaff');g.addColorStop(1,'#e8fbff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<5;i++){ctx.fillStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.arc(W*(i*.24+.05),H*.2,60+i*22,0,Math.PI*2);ctx.fill()}}
function draw(){drawSky();clouds.forEach(drawCloud);plats.slice().sort((a,b)=>a.z-b.z).forEach(drawPlatform);coins.forEach(drawCoin);gems.forEach(drawGem);drawPlayer();particles.forEach(q=>{let p=project(q.x,q.y,q.z);ctx.globalAlpha=q.life;ctx.fillStyle=q.color;ctx.fillRect(p.x,p.y,4,4);ctx.globalAlpha=1});}
function burst(x,z,color){for(let i=0;i<12;i++)particles.push({x:x+rand(-.5,.5),z:z+rand(-.5,.5),y:rand(.5,2),life:1,color})}
function jump(){if(!game||player.dead)return;if(player.jumps<2){player.vy=player.jumps===0?8.6:7.3;player.ground=false;player.jumps++;toast=player.jumps===2?'DOUBLE JUMP!':'JUMP!';toastTime=.5}}
function start(){reset();game=true;menu.style.display='none';controls.classList.remove('hidden');msg.textContent='';last=performance.now();requestAnimationFrame(loop)}
function loop(t){if(!game)return;let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
function update(dt){if(player.dead)return;let move=(keys.left?-1:0)+(keys.right?1:0)+touch.x;move=clamp(move,-1,1);player.x=clamp(player.x+move*7*dt,-5.4,5.4);player.z+=5.2*dt;dist=player.z;camZ=player.z-7;camX+=(player.x-camX)*.08;
player.vy-=19*dt;player.y+=player.vy*dt;if(player.y<=0){player.y=0;player.vy=0;player.ground=true;player.jumps=0}
let landed=false;for(const p of plats){let px=p.x+(p.type==='moving'?Math.sin(p.phase+=dt*1.8)*1.3:0);if(player.vy<=0&&player.y<=.3&&player.z>=p.z-p.d/2&&player.z<=p.z+p.d/2&&Math.abs(player.x-px)<p.w/2){player.y=.1;player.vy=0;player.ground=true;player.jumps=0;landed=true}}
if(player.z>4&&player.y<-.1){player.dead=true;game=false;msg.textContent='Oops! You fell ☁️';menu.style.display='block';menu.innerHTML='<h1>☁️ Try Again!</h1><p>Coins collected: '+score+'<br>Best: '+best+'</p><button id="start">PLAY AGAIN</button>';document.getElementById('start').onclick=start;controls.classList.add('hidden');return}
coins.forEach(o=>{if(!o.got&&Math.hypot(player.x-o.x,player.z-o.z)<.85&&player.y<1.8){o.got=true;score++;burst(o.x,o.z,'#ffd84d')}});gems.forEach(o=>{if(!o.got&&Math.hypot(player.x-o.x,player.z-o.z)<1&&player.y<2){o.got=true;score+=5;player.shield=3;toast='💎 +5 COINS · BOOST!';toastTime=1;burst(o.x,o.z,'#50f4ff')}});
coins=coins.filter(o=>!o.got&&o.z>player.z-14);gems=gems.filter(o=>!o.got&&o.z>player.z-14);plats=plats.filter(p=>p.z>player.z-16);ensureWorld();if(dist>level*40){level++;toast='LEVEL '+level+'!';toastTime=2}
clouds.forEach(c=>{c.z+=dt*1.2;if(c.z<player.z-20)c.z=player.z+rand(35,80)});particles.forEach(q=>q.life-=dt);particles=particles.filter(q=>q.life>0);
if(toastTime>0){toastTime-=dt;msg.textContent=toast}else msg.textContent='';
stats.innerHTML='🪙 '+score+'<br>LEVEL '+level+' · BEST '+best;
if(score>best){best=score;try{localStorage.skyjumpBest=best}catch(e){}}
}
function draw(){drawSky();clouds.forEach(drawCloud);plats.slice().sort((a,b)=>a.z-b.z).forEach(drawPlatform);coins.forEach(drawCoin);gems.forEach(drawGem);drawPlayer();particles.forEach(q=>{let p=project(q.x,q.y,q.z);ctx.globalAlpha=q.life;ctx.fillStyle=q.color;ctx.fillRect(p.x,p.y,4,4);ctx.globalAlpha=1})}
function loop(t){if(!game)return;let dt=Math.min(.035,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
function bindHold(id,key){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();keys[key]=true;b.setPointerCapture(e.pointerId)};b.onpointerup=b.onpointercancel=()=>keys[key]=false}
bindHold('left','left');bindHold('right','right');document.getElementById('jump').onpointerdown=e=>{e.preventDefault();jump()};document.getElementById('start').onclick=start;
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true});addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false});
for(let i=0;i<28;i++)clouds.push({x:rand(-12,12),y:rand(1,5),z:rand(-10,90),s:rand(1.4,4)});
reset();draw();
})();
</script></body></html>
