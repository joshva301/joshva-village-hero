<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Joshva Village Hero</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px 8px 28px;background:#172b20;color:#fff;text-align:center;font-family:Arial,sans-serif;touch-action:manipulation}
h2{margin:8px 0}.help{margin:8px 0 12px}canvas{display:block;width:min(600px,96vw);height:auto;margin:0 auto;background:#70a94b;border:4px solid white;border-radius:6px;touch-action:none}
#score{margin:12px 0}.weapons{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px auto;width:min(600px,96vw)}
button{color:white;font-weight:bold;cursor:pointer}.weapon{border:2px solid #dcebd8;border-radius:10px;background:#315d3b;padding:10px 14px;font-size:15px}.weapon.selected{background:#b87922;border-color:#ffe29a;box-shadow:0 0 0 2px #ffe29a}
#controls{width:min(600px,96vw);margin:12px auto;display:flex;align-items:center;justify-content:space-between;gap:15px;user-select:none;-webkit-user-select:none;touch-action:none}
#joystick{width:140px;height:140px;flex:0 0 140px;border-radius:50%;background:#294b32;border:4px solid #b9d8b7;position:relative;touch-action:none}
#stick{width:60px;height:60px;border-radius:50%;background:#82c879;border:3px solid white;position:absolute;left:36px;top:36px;pointer-events:none}
#action-buttons{display:grid;grid-template-columns:repeat(2,75px);gap:10px}
.control-btn{height:70px;border:2px solid white;border-radius:18px;background:#315d3b;color:white;font-weight:bold;font-size:15px;touch-action:none}
#sword-btn{background:#a63d35}#bow-btn{background:#3874a8}#magic-btn{background:#7048a8;grid-column:span 2}
.note{font-size:13px;opacity:.85;margin-top:10px}
@media(min-width:700px){#controls{display:none}}
</style>
</head>
<body>
<h2>⚔️ Joshva Village Hero</h2>
<p class="help">Move: Arrow Keys / WASD | Select weapon: 1, 2, 3 | Attack: Space</p>
<canvas id="game" width="600" height="400"></canvas>
<div class="weapons" aria-label="Choose weapon">
<button class="weapon selected" data-weapon="sword">⚔️ Sword (1)</button>
<button class="weapon" data-weapon="bow">🏹 Bow (2)</button>
<button class="weapon" data-weapon="magic">✨ Magic (3)</button>
</div>
<h3 id="score">Health: 100 | Enemies defeated: 0</h3>
<button id="restart" class="weapon">🔄 Restart Game</button>
<div id="controls" aria-label="Touch game controls">
<div id="joystick"><div id="stick"></div></div>
<div id="action-buttons">
<button class="control-btn" id="sword-btn">⚔️<br>SWORD</button>
<button class="control-btn" id="bow-btn">🏹<br>BOW</button>
<button class="control-btn" id="magic-btn">✨<br>MAGIC</button>
</div>
</div>
<p class="note">Choose Sword, Bow or Magic, then tap ATTACK. On computer use keys 1, 2, 3 and Space.</p>
<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
const player={x:300,y:200,h:100};
let enemies=[],keys={},score=0,weapon="sword",attackFlash=0,gameOver=false,won=false,invulnerableUntil=0,walkPhase=0,faceX=1,faceY=0;
function resetGame(){
 player.x=300;player.y=200;player.h=100;enemies=[];
 for(let i=0;i<5;i++)enemies.push({x:65+i*115,y:75+(i%2)*235,h:3,lastHit:0});
 score=0;gameOver=false;won=false;invulnerableUntil=0;keys={};
}
resetGame();
document.getElementById("restart").addEventListener("click",resetGame);
function chooseWeapon(name){
 weapon=name;
 document.querySelectorAll(".weapon").forEach(b=>b.classList.toggle("selected",b.dataset.weapon===name));
}
document.querySelectorAll(".weapon").forEach(b=>b.addEventListener("click",()=>chooseWeapon(b.dataset.weapon)));
document.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault();
 keys[k===" "?"space":k]=true;
 if(!e.repeat&&e.key==="1")chooseWeapon("sword");
 if(!e.repeat&&e.key==="2")chooseWeapon("bow");
 if(!e.repeat&&e.key==="3")chooseWeapon("magic");
 if(e.code==="Space"&&!e.repeat)attack();
});
document.addEventListener("keyup",e=>{const k=e.key.toLowerCase();keys[k===" "?"space":k]=false});
const joystick=document.getElementById("joystick"),stick=document.getElementById("stick");
let joyX=0,joyY=0,joystickActive=false;
joystick.addEventListener("pointerdown",e=>{joystickActive=true;joystick.setPointerCapture(e.pointerId);moveStick(e)});
joystick.addEventListener("pointermove",e=>{if(joystickActive)moveStick(e)});
function moveStick(e){
 const r=joystick.getBoundingClientRect();let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;
 const max=40,d=Math.hypot(x,y);if(d>max){x=x/d*max;y=y/d*max}
 stick.style.left=(36+x)+"px";stick.style.top=(36+y)+"px";joyX=x/max;joyY=y/max;
}
function resetJoystick(){joystickActive=false;joyX=0;joyY=0;stick.style.left="36px";stick.style.top="36px"}
joystick.addEventListener("pointerup",resetJoystick);joystick.addEventListener("pointercancel",resetJoystick);
["sword","bow","magic"].forEach(name=>document.getElementById(name+"-btn").addEventListener("pointerdown",e=>{e.preventDefault();chooseWeapon(name);attack()}));
function attack(){
 if(gameOver||won||!enemies.length)return;
 attackFlash=12;
 const range=weapon==="sword"?68:weapon==="bow"?230:145;
 const damage=weapon==="sword"?2:weapon==="bow"?1:2;
 // Bow hits the nearest enemy in range; Magic damages every enemy in its area.
 if(weapon==="bow"){
  const target=enemies.filter(m=>Math.hypot(m.x-player.x,m.y-player.y)<range).sort((a,b)=>Math.hypot(a.x-player.x,a.y-player.y)-Math.hypot(b.x-player.x,b.y-player.y))[0];
  if(target)target.h-=damage;
 }else{
  enemies.forEach(m=>{if(Math.hypot(m.x-player.x,m.y-player.y)<range)m.h-=damage});
 }
 enemies=enemies.filter(m=>m.h>0);score=5-enemies.length;
 if(enemies.length===0)won=true;
}
function drawEnemy(m){
 const bob=Math.sin((Date.now()/170)+m.x)*1.5;
 ctx.save();ctx.translate(m.x,m.y+bob);
 // shadow and small animated legs
 ctx.fillStyle="rgba(0,0,0,.22)";ctx.beginPath();ctx.ellipse(0,14,14,5,0,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="#4b3826";ctx.lineWidth=5;ctx.lineCap="round";
 const leg=Math.sin(Date.now()/130+m.x)*3;
 ctx.beginPath();ctx.moveTo(-5,5);ctx.lineTo(-7+leg,13);ctx.stroke();
 ctx.beginPath();ctx.moveTo(5,5);ctx.lineTo(7-leg,13);ctx.stroke();
 // monster body
 ctx.fillStyle="#668b42";ctx.strokeStyle="#365b2c";ctx.lineWidth=2;
 ctx.beginPath();ctx.roundRect(-11,-3,22,17,6);ctx.fill();ctx.stroke();
 // arms
 ctx.strokeStyle="#668b42";ctx.lineWidth=5;
 ctx.beginPath();ctx.moveTo(-9,0);ctx.lineTo(-15,4+leg);ctx.stroke();
 ctx.beginPath();ctx.moveTo(9,0);ctx.lineTo(15,4-leg);ctx.stroke();
 // hands
 ctx.fillStyle="#a1bb69";ctx.beginPath();ctx.arc(-15,4+leg,3,0,Math.PI*2);ctx.arc(15,4-leg,3,0,Math.PI*2);ctx.fill();
 // head with varied face details
 ctx.fillStyle="#83a955";ctx.strokeStyle="#365b2c";ctx.lineWidth=1.5;
 ctx.beginPath();ctx.ellipse(0,-10,11,10,0,0,Math.PI*2);ctx.fill();ctx.stroke();
 // ears
 ctx.beginPath();ctx.moveTo(-8,-15);ctx.lineTo(-14,-20);ctx.lineTo(-12,-10);ctx.closePath();ctx.fill();
 ctx.beginPath();ctx.moveTo(8,-15);ctx.lineTo(14,-20);ctx.lineTo(12,-10);ctx.closePath();ctx.fill();
 // small horns
 ctx.fillStyle="#d4c68a";ctx.beginPath();ctx.moveTo(-5,-18);ctx.lineTo(-8,-25);ctx.lineTo(-1,-19);ctx.closePath();ctx.fill();
 ctx.beginPath();ctx.moveTo(5,-18);ctx.lineTo(8,-25);ctx.lineTo(1,-19);ctx.closePath();ctx.fill();
 // eyes and eyebrows
 ctx.fillStyle="#fff";ctx.beginPath();ctx.ellipse(-4,-11,3,3.5,0,0,Math.PI*2);ctx.ellipse(4,-11,3,3.5,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#40251b";ctx.beginPath();ctx.arc(-4,-11,1.6,0,Math.PI*2);ctx.arc(4,-11,1.6,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="#365b2c";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-7,-16);ctx.lineTo(-2,-15);ctx.moveTo(2,-15);ctx.lineTo(7,-16);ctx.stroke();
 // nose and mouth
 ctx.fillStyle="#526e35";ctx.beginPath();ctx.arc(0,-7,1.5,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="#3e4f2b";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-3,-4);ctx.quadraticCurveTo(0,-1,3,-4);ctx.stroke();
 // health bar
 ctx.fillStyle="#4b2020";ctx.fillRect(-15,-29,30,5);ctx.fillStyle="#77e36a";ctx.fillRect(-15,-29,30*(m.h/3),5);
 ctx.restore();
}
function drawJoshva(){
 const moving=Math.abs(joyX)+Math.abs(joyY)>0.12||keys.arrowup||keys.arrowdown||keys.arrowleft||keys.arrowright||keys.w||keys.a||keys.s||keys.d;
 if(moving)walkPhase+=0.22;
 const swing=moving?Math.sin(walkPhase)*8:0;
 ctx.save();ctx.translate(player.x,player.y);
 // Ground shadow
 ctx.fillStyle="rgba(0,0,0,.25)";ctx.beginPath();ctx.ellipse(0,18,18,6,0,0,Math.PI*2);ctx.fill();
 // Boots and animated armored legs
 ctx.lineCap="round";
 ctx.strokeStyle="#34435d";ctx.lineWidth=8;
 ctx.beginPath();ctx.moveTo(-5,5);ctx.lineTo(-7+swing,16);ctx.lineTo(-8+swing,24);ctx.stroke();
 ctx.beginPath();ctx.moveTo(5,5);ctx.lineTo(7-swing,16);ctx.lineTo(8-swing,24);ctx.stroke();
 ctx.strokeStyle="#b8c5d3";ctx.lineWidth=5;
 ctx.beginPath();ctx.moveTo(-7+swing,13);ctx.lineTo(-8+swing,19);ctx.stroke();
 ctx.beginPath();ctx.moveTo(7-swing,13);ctx.lineTo(8-swing,19);ctx.stroke();
 ctx.fillStyle="#292e3b";ctx.beginPath();ctx.roundRect(-14+swing,21,13,7,3);ctx.roundRect(1-swing,21,13,7,3);ctx.fill();
 ctx.fillStyle="#b6c3d0";ctx.fillRect(-11+swing,22,6,2);ctx.fillRect(4-swing,22,6,2);
 // Blue tunic under chest armor
 ctx.fillStyle="#276c9f";ctx.strokeStyle="#173c58";ctx.lineWidth=2;
 ctx.beginPath();ctx.roundRect(-11,-7,22,17,5);ctx.fill();ctx.stroke();
 // Chest plate with highlighted edge
 ctx.fillStyle="#c2ccd5";ctx.strokeStyle="#667789";ctx.lineWidth=2;
 ctx.beginPath();ctx.moveTo(-9,-6);ctx.lineTo(-6,-10);ctx.lineTo(6,-10);ctx.lineTo(9,-6);ctx.lineTo(7,5);ctx.lineTo(0,9);ctx.lineTo(-7,5);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.fillStyle="#e3ebf2";ctx.beginPath();ctx.moveTo(-5,-7);ctx.lineTo(0,-8);ctx.lineTo(5,-7);ctx.lineTo(3,1);ctx.lineTo(0,4);ctx.lineTo(-3,1);ctx.closePath();ctx.fill();
 // Belt and golden clasp
 ctx.fillStyle="#5d3826";ctx.fillRect(-10,5,20,4);ctx.fillStyle="#e4b84f";ctx.fillRect(-2,4,4,5);
 // Shoulder armor
 ctx.fillStyle="#8e9eae";ctx.strokeStyle="#526678";ctx.lineWidth=1.5;
 ctx.beginPath();ctx.arc(-11,-5,6,Math.PI*.7,Math.PI*1.9);ctx.fill();ctx.stroke();
 ctx.beginPath();ctx.arc(11,-5,6,Math.PI*1.1,Math.PI*2.3);ctx.fill();ctx.stroke();
 // Arms with gauntlets, animated
 ctx.strokeStyle="#d6a879";ctx.lineWidth=5;
 ctx.beginPath();ctx.moveTo(-9,-3);ctx.lineTo(-15,-1+swing*.6);ctx.lineTo(-17,7+swing*.6);ctx.stroke();
 ctx.beginPath();ctx.moveTo(9,-3);ctx.lineTo(15,-1-swing*.6);ctx.lineTo(17,7-swing*.6);ctx.stroke();
 ctx.fillStyle="#aebbc8";ctx.strokeStyle="#667789";ctx.lineWidth=1;
 ctx.beginPath();ctx.roundRect(-20,4+swing*.6,7,7,2);ctx.fill();ctx.stroke();
 ctx.beginPath();ctx.roundRect(13,4-swing*.6,7,7,2);ctx.fill();ctx.stroke();
 // Head and hair
 ctx.fillStyle="#f0bd8b";ctx.strokeStyle="#7c4b2c";ctx.lineWidth=1.5;
 ctx.beginPath();ctx.arc(0,-15,9,0,Math.PI*2);ctx.fill();ctx.stroke();
 ctx.fillStyle="#3b2418";ctx.beginPath();ctx.arc(0,-19,9,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(-8,-19,16,4);
 // Small helmet brow / adventurer headband
 ctx.fillStyle="#c4ced7";ctx.fillRect(-8,-18,16,3);ctx.fillStyle="#e4bd55";ctx.fillRect(-2,-18,4,3);
 ctx.fillStyle="#202020";ctx.beginPath();ctx.arc(-3,-14,1.2,0,Math.PI*2);ctx.arc(3,-14,1.2,0,Math.PI*2);ctx.fill();
 // Equipment: dual swords when Sword is selected, otherwise keep bow or magic.
 if(weapon==="sword"){
  // Left sword
  ctx.save();ctx.translate(-19,8+swing*.6);ctx.rotate(0.45+Math.sin(walkPhase)*.12);
  ctx.strokeStyle="#dbe7ef";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,2);ctx.lineTo(0,-17);ctx.stroke();
  ctx.strokeStyle="#f8f8f8";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(1,-4);ctx.lineTo(1,-17);ctx.stroke();
  ctx.strokeStyle="#b78a43";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-5,1);ctx.lineTo(5,1);ctx.stroke();
  ctx.strokeStyle="#49301e";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,3);ctx.lineTo(0,8);ctx.stroke();ctx.restore();
  // Right sword
  ctx.save();ctx.translate(19,8-swing*.6);ctx.rotate(-0.45+Math.sin(walkPhase)*.12);
  ctx.strokeStyle="#dbe7ef";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,2);ctx.lineTo(0,-17);ctx.stroke();
  ctx.strokeStyle="#f8f8f8";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-1,-4);ctx.lineTo(-1,-17);ctx.stroke();
  ctx.strokeStyle="#b78a43";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-5,1);ctx.lineTo(5,1);ctx.stroke();
  ctx.strokeStyle="#49301e";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,3);ctx.lineTo(0,8);ctx.stroke();ctx.restore();
 }else if(weapon==="bow"){
  ctx.strokeStyle="#9a6635";ctx.lineWidth=3;ctx.beginPath();ctx.arc(23,2,13,-1.2,1.2);ctx.stroke();
  ctx.strokeStyle="#e5e5e5";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(14,-10);ctx.lineTo(14,14);ctx.stroke();
 }else{
  ctx.fillStyle="#b68aff";ctx.strokeStyle="#efe1ff";ctx.lineWidth=1;ctx.beginPath();ctx.arc(20,4,6,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle="#e6d4ff";ctx.beginPath();ctx.arc(20,4,2,0,Math.PI*2);ctx.fill();
 }
 // Name and temporary shield aura
 ctx.fillStyle="#fff";ctx.font="bold 12px Arial";ctx.textAlign="center";ctx.fillText("Joshva",0,-31);
 if(Date.now()<invulnerableUntil){ctx.strokeStyle="#8eeaff";ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,28,0,Math.PI*2);ctx.stroke();}
 if(attackFlash>0){ctx.font="22px Arial";ctx.fillText(weapon==="sword"?"⚔️":weapon==="bow"?"🏹":"✨",26,-8);}
 ctx.restore();
}
function drawHouse(x,y,w,h){
 // Warm village cottage with layered roof, plaster, timber and windows
 ctx.fillStyle="rgba(0,0,0,.16)";ctx.beginPath();ctx.ellipse(x+w/2,y+h+5,w*.62,8,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#d5b17c";ctx.fillRect(x,y+18,w,h-18);
 ctx.fillStyle="#a66d45";ctx.fillRect(x+4,y+22,w-8,h-25);
 ctx.fillStyle="#d8b987";ctx.fillRect(x+7,y+25,w-14,h-29);
 ctx.fillStyle="#8b4934";ctx.beginPath();ctx.moveTo(x-10,y+21);ctx.lineTo(x+w/2,y-10);ctx.lineTo(x+w+10,y+21);ctx.closePath();ctx.fill();
 ctx.fillStyle="#b96542";ctx.beginPath();ctx.moveTo(x-4,y+20);ctx.lineTo(x+w/2,y-5);ctx.lineTo(x+w+4,y+20);ctx.closePath();ctx.fill();
 ctx.strokeStyle="#77432e";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-7,y+22);ctx.lineTo(x+w/2,y-8);ctx.lineTo(x+w+7,y+22);ctx.stroke();
 for(const wx of [x+10,x+w-27]){
  ctx.fillStyle="#754a32";ctx.fillRect(wx-2,y+29,21,23);ctx.fillStyle="#8ed1dc";ctx.fillRect(wx,y+31,17,19);
  ctx.strokeStyle="#754a32";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(wx+8,y+31);ctx.lineTo(wx+8,y+50);ctx.moveTo(wx,y+40);ctx.lineTo(wx+17,y+40);ctx.stroke();
 }
 ctx.fillStyle="#62422c";ctx.fillRect(x+w/2-10,y+h-26,20,26);ctx.fillStyle="#8b6543";ctx.fillRect(x+w/2-7,y+h-23,14,23);
 ctx.fillStyle="#d4a35f";ctx.beginPath();ctx.arc(x+w/2+5,y+h-14,1.8,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#6d4a32";ctx.fillRect(x+4,y+h-5,w-8,5);
}
function drawTree(x,y){
 ctx.fillStyle="rgba(0,0,0,.17)";ctx.beginPath();ctx.ellipse(x+3,y+31,24,7,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#704625";ctx.fillRect(x-6,y+7,12,27);ctx.fillStyle="#8d6035";ctx.fillRect(x-3,y+9,3,23);
 ctx.fillStyle="#28623a";ctx.beginPath();ctx.arc(x,y-1,23,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#347b40";ctx.beginPath();ctx.arc(x-13,y-8,16,0,Math.PI*2);ctx.arc(x+13,y-7,16,0,Math.PI*2);ctx.arc(x,y-18,16,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#62a94f";ctx.beginPath();ctx.arc(x-7,y-18,7,0,Math.PI*2);ctx.arc(x+10,y-12,6,0,Math.PI*2);ctx.arc(x-16,y-5,5,0,Math.PI*2);ctx.fill();
}
function drawBush(x,y){
 ctx.fillStyle="#28633b";ctx.beginPath();ctx.arc(x-8,y,11,0,Math.PI*2);ctx.arc(x+4,y-5,13,0,Math.PI*2);ctx.arc(x+14,y+2,9,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#5da84e";ctx.beginPath();ctx.arc(x-6,y-5,4,0,Math.PI*2);ctx.arc(x+8,y-8,4,0,Math.PI*2);ctx.fill();
}
function drawFence(x,y,count,step){
 ctx.strokeStyle="#79552f";ctx.lineWidth=4;
 for(let i=0;i<count;i++){ctx.fillStyle="#9a7041";ctx.fillRect(x+i*step,y-8,4,23)}
 ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+(count-1)*step,y);ctx.moveTo(x,y+9);ctx.lineTo(x+(count-1)*step,y+9);ctx.stroke();
}
function drawFlower(x,y){
 ctx.fillStyle="#e8d5a0";ctx.beginPath();ctx.arc(x,y,2,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#d96f91";for(let a=0;a<Math.PI*2;a+=Math.PI/2){ctx.beginPath();ctx.arc(x+Math.cos(a)*3,y+Math.sin(a)*3,2,0,Math.PI*2);ctx.fill();}
}
function draw(){
 ctx.clearRect(0,0,600,400);
 // Camera zoom: draw the village and characters closer while keeping the canvas centered.
 const zoom=1.22;
 ctx.save();
 ctx.translate(300,200);
 ctx.scale(zoom,zoom);
 ctx.translate(-300,-200);
 ctx.fillStyle="#579447";ctx.fillRect(0,0,600,400);
 for(let i=0;i<150;i++){const x=(i*73+19)%600,y=(i*47+31)%400;ctx.fillStyle=i%2?"#69a951":"#4c873e";ctx.fillRect(x,y,3,3);}
 ctx.fillStyle="#c9ad78";ctx.beginPath();ctx.moveTo(0,155);ctx.quadraticCurveTo(170,175,260,230);ctx.quadraticCurveTo(420,285,600,245);ctx.lineTo(600,300);ctx.quadraticCurveTo(400,330,230,260);ctx.quadraticCurveTo(100,205,0,205);ctx.closePath();ctx.fill();
 drawHouse(34,55,78,65);drawHouse(485,55,78,65);drawHouse(475,300,76,62);
 drawTree(160,70);drawTree(430,115);drawTree(100,310);drawTree(535,215);drawTree(355,330);
 drawBush(205,105);drawBush(285,330);drawBush(445,285);drawBush(70,235);drawBush(565,85);
 drawFence(115,284,5,14);drawFence(390,55,5,14);
 for(let i=0;i<26;i++)drawFlower((i*97+21)%600,(i*61+17)%400);
 for(let i=0;i<18;i++){ctx.fillStyle="#8c8b78";ctx.beginPath();ctx.ellipse((i*41+23)%600,(i*67+19)%400,3,2,0,0,Math.PI*2);ctx.fill();}
 enemies.forEach(m=>drawEnemy(m));
 drawJoshva();
 if(attackFlash>0){ctx.font="27px Arial";ctx.fillText(weapon==="sword"?"⚔️":weapon==="bow"?"➶":"✨",player.x+18,player.y-5);attackFlash--}
 ctx.restore();
 document.getElementById("score").innerText="Health: "+player.h+" | Enemies defeated: "+score+" | Weapon: "+weapon.toUpperCase();
 if(gameOver||won){ctx.fillStyle="#fff";ctx.font="35px Arial";ctx.fillText(gameOver?"GAME OVER":"YOU WIN!",210,200);ctx.font="17px Arial";ctx.fillText("Tap Restart Game",220,230)}
}
function update(){
 if(!gameOver&&!won){
  const now=Date.now();
  // Only one enemy is allowed to attack at a time; others wait nearby.
  const attacker=enemies.find(m=>Math.hypot(player.x-m.x,player.y-m.y)<110) || enemies[0];
  enemies.forEach(m=>{
   const dx=player.x-m.x,dy=player.y-m.y,d=Math.hypot(dx,dy)||1;
   if(m===attacker){
    if(d>27){m.x+=dx/d*0.55;m.y+=dy/d*0.55}
    else if(now-m.lastHit>1100&&now>invulnerableUntil){
     player.h=Math.max(0,player.h-8);m.lastHit=now;invulnerableUntil=now+650;
     if(player.h<=0)gameOver=true;
    }
   }else if(d>70){m.x+=dx/d*0.25;m.y+=dy/d*0.25;}
  });
 }
 if(!gameOver&&!won){player.x+=joyX*3;player.y+=joyY*3;
 if(keys.arrowup||keys.w)player.y-=3;if(keys.arrowdown||keys.s)player.y+=3;
 if(keys.arrowleft||keys.a)player.x-=3;if(keys.arrowright||keys.d)player.x+=3;
 player.x=Math.max(55,Math.min(545,player.x));player.y=Math.max(70,Math.min(330,player.y));
 }
 draw();requestAnimationFrame(update);
}
update();
</script>
