<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Joshva Village Hero</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 16px 8px 28px;
  background: #172b20;
  color: white;
  text-align: center;
  font-family: Arial, sans-serif;
  touch-action: manipulation;
}
h2 { margin: 8px 0; }
.help { margin: 8px 0 12px; }
canvas {
  display: block;
  width: min(600px, 96vw);
  height: auto;
  margin: 0 auto;
  background: #70a94b;
  border: 4px solid white;
  border-radius: 6px;
  touch-action: none;
}
#score { margin: 12px 0; }
#controls {
  width: min(420px, 96vw);
  margin: 12px auto 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  user-select: none;
  -webkit-user-select: none;
}
#pad {
  display: grid;
  grid-template-columns: repeat(3, 58px);
  grid-template-rows: repeat(2, 54px);
  gap: 5px;
}
.control-btn {
  border: 2px solid #e9f5e8;
  border-radius: 13px;
  background: #315d3b;
  color: white;
  font-size: 25px;
  font-weight: bold;
  box-shadow: 0 3px 0 #183522;
  touch-action: none;
}
.control-btn:active { background: #548b4e; transform: translateY(2px); box-shadow: 0 1px 0 #183522; }
#up { grid-column: 2; grid-row: 1; }
#left { grid-column: 1; grid-row: 2; }
#down { grid-column: 2; grid-row: 2; }
#right { grid-column: 3; grid-row: 2; }
#attack {
  width: 108px;
  height: 86px;
  border-radius: 50%;
  background: #9c382e;
  font-size: 19px;
}
.note { font-size: 13px; opacity: .85; margin-top: 10px; }
@media (min-width: 700px) {
  #controls { display: none; }
}
</style>
</head>
<body>
<h2>⚔️ Joshva Village Hero</h2>
<p class="help">Move: Arrow Keys / WASD | Attack: Space</p>
<canvas id="game" width="600" height="400"></canvas>
<h3 id="score">Health: 100 | Enemies defeated: 0</h3>

<div id="controls" aria-label="Touch game controls">
  <div id="pad">
    <button class="control-btn" id="up" data-key="arrowup" aria-label="Move up">▲</button>
    <button class="control-btn" id="left" data-key="arrowleft" aria-label="Move left">◀</button>
    <button class="control-btn" id="down" data-key="arrowdown" aria-label="Move down">▼</button>
    <button class="control-btn" id="right" data-key="arrowright" aria-label="Move right">▶</button>
  </div>
  <button class="control-btn" id="attack" aria-label="Attack">⚔️<br>ATTACK</button>
</div>
<p class="note">On phones, hold the arrow buttons to move and tap ATTACK to fight.</p>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");
let player = {x:300, y:200, h:100};
let enemies = [];
let keys = {};
let score = 0;

function resetEnemies() {
  enemies = [];
  for (let i = 0; i < 5; i++) {
    enemies.push({x:50 + i * 110, y:70, h:2});
  }
  score = 0;
}
resetEnemies();

document.addEventListener("keydown", e => {
  const key = e.key.toLowerCase();
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(key)) e.preventDefault();
  keys[key === " " ? "space" : key] = true;
  if (e.code === "Space" && !e.repeat) attack();
});
document.addEventListener("keyup", e => {
  const key = e.key.toLowerCase();
  keys[key === " " ? "space" : key] = false;
});

document.querySelectorAll("[data-key]").forEach(button => {
  const key = button.dataset.key;
  const release = e => {
    e.preventDefault();
    keys[key] = false;
  };
  button.addEventListener("pointerdown", e => {
    e.preventDefault();
    keys[key] = true;
    button.setPointerCapture(e.pointerId);
  });
  button.addEventListener("pointerup", release);
  button.addEventListener("pointercancel", release);
  button.addEventListener("lostpointercapture", () => { keys[key] = false; });
});

document.getElementById("attack").addEventListener("pointerdown", e => {
  e.preventDefault();
  attack();
});

function attack() {
  enemies.forEach(enemy => {
    if (Math.hypot(enemy.x - player.x, enemy.y - player.y) < 65) enemy.h--;
  });
  enemies = enemies.filter(enemy => enemy.h > 0);
  score = 5 - enemies.length;
}

function draw() {
  ctx.clearRect(0, 0, 600, 400);
  ctx.fillStyle = "#397d38";
  ctx.fillRect(0, 0, 600, 400);

  ctx.fillStyle = "#d9c18b";
  ctx.fillRect(0, 0, 600, 35);
  ctx.fillRect(0, 365, 600, 35);

  ctx.font = "30px Arial";
  ctx.fillText("🏡", 40, 90);
  ctx.fillText("🌳", 500, 100);
  ctx.fillText("🌳", 80, 330);

  enemies.forEach(enemy => {
    ctx.font = "30px Arial";
    ctx.fillText("👹", enemy.x, enemy.y);
  });

  ctx.fillText("🧑", player.x - 15, player.y + 10);
  ctx.fillStyle = "white";
  ctx.font = "18px Arial";
  ctx.fillText("Joshva", player.x - 25, player.y - 15);

  document.getElementById("score").innerText =
    "Health: " + player.h + " | Enemies defeated: " + score;

  if (enemies.length === 0) {
    ctx.font = "35px Arial";
    ctx.fillText("YOU WIN!", 220, 200);
  }
}

function update() {
  if (keys["arrowup"] || keys["w"]) player.y -= 3;
  if (keys["arrowdown"] || keys["s"]) player.y += 3;
  if (keys["arrowleft"] || keys["a"]) player.x -= 3;
  if (keys["arrowright"] || keys["d"]) player.x += 3;

  player.x = Math.max(20, Math.min(580, player.x));
  player.y = Math.max(50, Math.min(350, player.y));
  draw();
  requestAnimationFrame(update);
}
update();
</script>
</body>
</html>
