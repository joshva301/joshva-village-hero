<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joshva Village Hero</title>
<style>
body {
  background: #172b20;
  color: white;
  text-align: center;
  font-family: Arial;
}
canvas {
  background: #70a94b;
  border: 4px solid white;
  max-width: 95%;
}
</style>
</head>
<body>
<h2>⚔️ Joshva Village Hero</h2>
<p>Move: Arrow Keys | Attack: Space</p>
<canvas id="game" width="600" height="400"></canvas>
<h3 id="score">Health: 100 | Enemies: 5</h3>
<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");
let player = {x:300,y:200,h:100};
let enemies = [];
let keys = {};
let score = 0;

for(let i=0;i<5;i++)
 enemies.push({x:50+i*110,y:70,h:2});

document.onkeydown=e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.code==="Space") attack();
};
document.onkeyup=e=>keys[e.key.toLowerCase()]=false;

function attack(){
 enemies.forEach(e=>{
  if(Math.hypot(e.x-player.x,e.y-player.y)<65)
   e.h--;
 });
 enemies=enemies.filter(e=>e.h>0);
 score=5-enemies.length;
}

function draw(){
 ctx.clearRect(0,0,600,400);
 ctx.fillStyle="#397d38";
 ctx.fillRect(0,0,600,400);

 ctx.fillStyle="#d9c18b";
 ctx.fillRect(0,0,600,35);
 ctx.fillRect(0,365,600,35);

 ctx.font="30px Arial";
 ctx.fillText("🏡",40,90);
 ctx.fillText("🌳",500,100);
 ctx.fillText("🌳",80,330);

 enemies.forEach(e=>{
  ctx.font="30px Arial";
  ctx.fillText("👹",e.x,e.y);
 });

 ctx.fillText("🧑",player.x-15,player.y+10);

 ctx.fillStyle="white";
 ctx.font="18px Arial";
 ctx.fillText("Joshva",player.x-25,player.y-15);

 document.getElementById("score").innerText=
 "Health: "+player.h+" | Enemies defeated: "+score;

 if(enemies.length===0){
  ctx.font="35px Arial";
  ctx.fillText("YOU WIN!",220,200);
 }
}

function update(){
 if(keys["arrowup"]||keys["w"]) player.y-=3;
 if(keys["arrowdown"]||keys["s"]) player.y+=3;
 if(keys["arrowleft"]||keys["a"]) player.x-=3;
 if(keys["arrowright"]||keys["d"]) player.x+=3;

 player.x=Math.max(20,Math.min(580,player.x));
 player.y=Math.max(50,Math.min(350,player.y));
 draw();
 requestAnimationFrame(update);
}
update();
</script>
</body>
</html>
